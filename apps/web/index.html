<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('theme') || 'dark'
          var dark =
            t === 'dark' ||
            (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', dark ? '#0b0b0c' : '#faf7f2')
        } catch (e) {}
      })()
    </script>
    <meta
      name="description"
      content="Terapeuta del Caos · JR Rivera. Transformación emocional e integración: un proceso diferente, con presencia y acompañamiento real."
    />
